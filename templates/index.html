<html lang="de">
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HexToBinTrainer</title>
    </head>
    <body>
        <div class="container">
            <nav class="tab-nav">
                <a href="" class="tab-item active">HexToBin</a>
                <a href="" class="tab-item">BinToHex</a>
<!--                <a href="#3" class="tab-item">Ausstehend</a>-->
            </nav>
        </div>

        <div class="converter-box">
            <div class="info-box">
                <div class="bit-selector">
                    <span class="bit-display">Bits: </span>
                    <span class="bit-display" id="bit-amount">08</span>
                    <span style="padding-inline: 5px;"></span>
                    <button hidden id="bit-button">An Backend senden</button>
                    <button id="increase-bits" class="bit-button">+</button>
                    <button id="decrease-bits" class="bit-button">-</button>
                </div>
                <div class="name-input-wrapper">
                    <label for="name-input"></label>
                    <input type="text" class="input-field" value="{{ name }}" id="name-input" placeholder="Name..." autocomplete="off">
                    <button type="submit" id="name-button">&checkmark;</button>
                </div>
            </div>
        </div>

        <div class="converter-box">
            <div class="info-box">
                <div class="hex-display" id="hex-output"></div>
                <div>
                    &#x2705;<span class="counter" id="correct-counter">{{ correct }}</span>
                    &#x274C;<span class="counter" id="wrong-counter">{{ wrong }}</span>
                </div>
            </div>
            <div class="input-wrapper">
                <label for="binary-input"></label>
                <input type="text" class="input-field" id="binary-input" placeholder="Binärzahl eingeben..." autocomplete="off">
            </div>
            <button hidden id="send-button">An Backend senden</button>
        </div>
    </body>
</html>
